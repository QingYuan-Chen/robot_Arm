# ament_python 包的可执行脚本安装位置约定。
# 构建时把 console_scripts 生成的可执行文件放到 lib/<包名>/ 下，运行时 ros2 run <包名> <可执行名>
# 才能按该路径找到它们；$base 由构建系统在安装阶段展开为安装前缀。
# [develop] 用于开发空间（--symlink-install 等）安装，[install] 用于常规安装，两者必须一致。
[develop]
script_dir=$base/lib/rebotarm_motion
[install]
install_scripts=$base/lib/rebotarm_motion
