# 视觉就绪位姿参数（运动包 config 目录）。
#
# 用途：视觉抓取链路要求机械臂先摆到一个固定的观察位姿（相机视角与手眼关系在该位姿下标定），
# 上层再启动检测与抓取规划。本文件由上层启动组合以参数文件形式加载，供同一节点的两个实例
# 使用，两个实例共用同一组位姿参数：
#   rebotarm_visual_ready_startup —— 启动实例：开机自动摆位，摆完即退出进程，
#                                    上层用"进程退出"事件串联后续节点；
#   rebotarm_visual_ready         —— 常驻实例：不自动运动，只提供 visual_ready/move 服务，
#                                    供界面或操作者在需要时把机械臂摆回观察位姿。
#
# 关节顺序固定为 joint1..joint6（6 个手臂关节），角度单位 rad；夹爪不参与就绪位姿。
# 原始上游姿态为 joint1=0（朝 base +X），当前安装朝向视觉工作区在 base -Y 方向，
# 因此把 joint1 旋转 -90°（-1.5707963267948966 rad ≈ -π/2）。

rebotarm_visual_ready_startup:
  ros__parameters:
    # 启动后是否自动执行一次就绪移动。true = 启动即摆位（配合下面的退出开关做一次性启动动作）；
    # false = 只建立服务不运动，此时该实例与常驻实例行为一致。
    auto_move_on_start: true
    # 启动移动流程结束后是否立即退出进程（不看移动成功与否，成败只体现在日志里）。
    # 仅启动实例需要：上层据"进程退出"事件衔接后续节点；常驻实例不设该键，取节点默认 false。
    exit_after_startup_move: true
    # 启动移动前的等待时间（s），用于等控制器、时钟或底层驱动就绪。
    # 0.0 表示不等待；调大只推迟动作开始时间，不改变轨迹本身（轨迹时长由 duration_sec 决定）。
    startup_delay_sec: 0.0
    # 观察位姿的 6 个手臂关节角（rad，顺序 joint1..joint6），必须全部为有限值，否则节点拒绝下发。
    joint_positions: [-1.5707963267948966, -0.1, -0.2, 0.2, 0.0, 0.0]
    # 轨迹总时长（s），节点内部有 0.2 s 下限；调小会提高关节速度与加速度，调大更平缓。
    duration_sec: 4.0
    # 等待首帧关节反馈、以及等待控制器动作服务上线的时间上限（s）。超时即失败返回，不自动重试；
    # 注意等待动作执行结果本身没有超时，控制器不返回时流程会一直阻塞。
    wait_timeout_sec: 12.0
    # 起始偏差保护（rad）：当前关节角与目标之间"单关节最大偏差"超过该值就拒绝移动，
    # 避免上电位置离观察位太远时直接插值造成大幅横扫；<= 0 表示显式关闭该保护。
    max_start_delta_rad: 1.0

rebotarm_visual_ready:
  ros__parameters:
    # 常驻实例不自动运动，只响应 visual_ready/move 服务调用。
    auto_move_on_start: false
    # 观察位姿 6 关节角（rad，joint1..joint6）：必须与启动实例保持一致，否则服务触发的摆位
    # 与标定/检测所用的位姿不符，手眼关系不再成立。
    joint_positions: [-1.5707963267948966, -0.1, -0.2, 0.2, 0.0, 0.0]
    # 同上：服务触发的移动同样使用该轨迹时长（s，内部下限 0.2 s）。
    duration_sec: 4.0
    # 同上：单次服务调用的等待上限（s）；服务是同步的，调用方需自留更长超时。
    wait_timeout_sec: 12.0
    # 同上：服务触发的移动同样受该起始偏差保护约束，防止从远处大幅横扫。
    max_start_delta_rad: 1.0
