# ament_python 安装配置：决定 console_scripts 生成的入口脚本放在哪里。
# 放到各包私有的 lib/<包名> 目录，避免多个 ROS 包的可执行文件在同一个 bin 目录里重名冲突。
[develop]
# 开发模式（colcon build --symlink-install）下的入口脚本目录，$base 为安装前缀
script_dir=$base/lib/rebotarmcontroller
[install]
# 正式安装时的入口脚本目录，$base 为安装前缀（一般为 install/rebotarmcontroller）
install_scripts=$base/lib/rebotarmcontroller
