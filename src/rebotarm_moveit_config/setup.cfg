# ament_python 包的可执行脚本安装位置约定（两节必须保持一致）。
#
# 本包（MoveIt 配置包）没有 console_scripts 入口，只有数据文件；这里保留标准布局是为了让
# ros2/ament 能正常识别本包，同时保证构建产物结构与其它包一致。
# $base 由构建系统在安装阶段展开为安装前缀（install/rebotarm_moveit_config），不能写成绝对路径。
[develop]
# 开发模式（colcon build --symlink-install 等符号链接安装）下的脚本目录
script_dir=$base/lib/rebotarm_moveit_config
[install]
# 正式安装时的脚本目录，$base 为安装前缀
install_scripts=$base/lib/rebotarm_moveit_config
