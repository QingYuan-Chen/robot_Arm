# GraspNet 通用（flat）抓取候选参数档，供抓取候选逆解过滤节点使用。
#
# 核心取舍：候选的 6D 抓取位姿由 GraspNet 直接给出并被原样保留
# （candidate_pose_policy 取 preserve_candidate_pose），不再改写姿态；直立、平躺、
# 倾斜物体走同一条处理路径，由下游的 IK 过滤器统一施加工作空间盒、接近点高度、
# 关节运动量（joint6 限幅/对称）与夹爪开口等闸门。因此本档的"过滤"全部落在下游，
# 这里只描述位姿与几何约束。
# 注意：本文件中的参数键都是对外接口，禁止改动；只允许增加注释。
flat_graspnet:
  # 位姿策略：preserve_candidate_pose = 原样保留 GraspNet 给出的 6D 姿态；
  # 改为其它取值（如 hybrid_geometry / base_axis）会重新构造姿态，抓取语义随之变化。
  candidate_pose_policy: preserve_candidate_pose
  # 操作员实测的 end_link -> TCP 偏移（末端连杆局部坐标系，单位 m），
  # 即夹爪夹持中心沿末端 X 轴后移 4 cm；求 IK 前从目标位姿中扣减。
  # 不要替换为仿真模型里的等效点，两者并不一致。
  tcp_offset_xyz: [-0.04, 0.0, 0.0]
  # 目标点在基座系下的整体平移补偿（单位 m），用于吸收手眼/TCP 标定残差；
  # 默认全 0 表示不补偿，非零值会让所有抓取位姿整体偏移，须谨慎设置。
  target_base_offset_xyz: [0.0, 0.0, 0.0]
  # 是否启用工作空间盒闸门。本档为 true，抓取点必须落在下面 min/max 构成的盒内，
  # 否则该候选直接判不可达（防止规划到工作区之外）。
  candidate_workspace_gate_enabled: true
  # 旧仓库 +X 工作空间盒最小角（基座系，单位 m）
  candidate_workspace_min_xyz: [0.18, -0.35, 0.0]
  # 工作空间盒最大角（基座系，单位 m）；与上一项共同定义允许抓取的盒范围
  candidate_workspace_max_xyz: [0.64, 0.35, 0.45]
  # 抓取点到目标中心的最大允许偏差（单位 m，0.15 = 15 cm）；
  # 超出说明抓取点已明显偏离物体（深度或分割异常），判定该候选不可信。
  candidate_max_grasp_to_object_center_m: 0.15
  # 每帧最多处理的候选数（下限被钳到 1）。超出部分直接丢弃，
  # 用于限制单帧 IK 与碰撞检查的调用量；调大更可能命中可行解，但会拖慢单帧处理。
  candidate_max_candidates_per_frame: 20
  # 偏航角偏移列表（单位 rad）。每个元素生成一组姿态变体，用于绕竖直轴尝试不同抓取朝向；
  # 只有一个 0.0 表示不做偏航试探。
  candidate_orientation_yaw_offsets_rad: [0.0]
  # 抓取点高度附加偏移列表（单位 m）。每个元素生成一组变体，用于沿高度方向微调抓取深度；
  # 只有一个 0.0 表示不加偏移。
  candidate_grasp_z_offsets_m: [0.0]
  # 夹爪可信行程下限（单位 m，物体在张合方向的尺寸）；小于该开口认为夹不稳目标
  candidate_min_jaw_width_m: 0.006
  # 夹爪可信行程上限（单位 m）；大于该开口说明夹爪张不到位（会被行程截断），判该候选不可用
  candidate_max_jaw_width_m: 0.085
  # 抓取点最低允许高度（单位 m，基座系，z 轴向上）；低于该值判为贴地/穿桌。
  # 0.0 只拦"到桌面以下"，实际桌面安全由接近点高度与撤退策略共同保证。
  candidate_min_grasp_z_m: 0.0
  # 预抓取目标在 base_link 下的 Z 下限（0.04 m = 4 cm）；
  # 低于时抬高到该值；不是相对桌面的净空高度，仍需碰撞检查。
  candidate_pregrasp_min_z_m: 0.04
  # 关节位移在候选评分中的权重（每 rad 的扣分）；调大更偏好关节动作小的解，动作更省但可能牺牲抓取质量
  candidate_score_joint_distance_weight: 0.15
  # joint6（腕部旋转）变化量在评分中的独立权重（每 rad 的扣分）；
  # 单独加权用于抑制腕部绕线，调大更倾向保持腕部姿态
  candidate_score_joint6_weight: 0.35
  # joint6 变化量上限（单位 rad，1.5708 ≈ 90°）。超过直接判该解不可行，
  # 是防止腕部大幅翻转的硬闸门；调小更保守（可能无解），调大更容易求解但绕线风险上升。
  candidate_max_joint6_delta_rad: 1.5708
  # 是否追加平行夹爪对称姿态变体：平行夹爪绕末端张合轴转 180° 后仍是同一次物理抓取，
  # 开启后相当于把可用解空间扩大一倍。
  candidate_joint6_symmetry_enabled: true
  # 对称变体的旋转角（单位 rad，3.141592653589793 = π）。只有平行夹爪的 180° 对称才物理等价，
  # 因此不应随意改成其它角度。
  candidate_joint6_symmetry_angle_rad: 3.141592653589793
