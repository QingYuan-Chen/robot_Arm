# GraspNet 抓取候选推理参数：由上层启动组合包加载到 GraspNet 基线节点
# （rebotarm_graspnet_baseline_node）。
# 该节点把 RGB-D + 检测结果送进 GraspNet 后端，产出 6D 抓取候选；它只做感知推理，
# 不触发任何运动，抓取可行性由下游逆解过滤节点判定。
# 注意：本文件中的话题名、坐标系名与参数键都是对外接口，禁止改动；只允许增加注释。
rebotarm_graspnet_baseline_node:
  ros__parameters:
    # 输入彩色图话题（bgr8）；与深度图、检测结果三者按时间戳就近配对
    input_color_topic: /camera/color/image_raw
    # 输入深度图话题（16UC1，单位由 depth_scale_m_per_unit 换算）
    input_depth_topic: /camera/depth/image_raw
    # 输入相机内参话题（深度流）；推理时使用消息里的实时内参，参数里的 fx/fy/cx/cy 仅作回退
    input_camera_info_topic: /camera/depth/camera_info
    # 输入检测结果话题（检测框/掩膜），用于把点云裁剪到目标区域
    input_detections_topic: /grasp/detections
    # 输出抓取候选数组话题，供下游逆解过滤节点消费
    output_candidates_topic: /grasp/graspnet_candidates
    # 输出候选位姿的坐标系：深度光学坐标系，与深度图 frame_id 一致
    output_frame_id: camera_depth_frame
    # 彩色/深度/检测三者允许的最大时间偏差（单位 ms）。超出则本帧不推理，
    # 等新帧到齐后重试；调小对同步更严格（可能丢帧），调大会用上时间上不匹配的帧。
    max_input_skew_ms: 100
    # GraspNet 模型根目录。留空表示未配置（后端不可用），需由启动文件或环境变量注入
    model_root: ""
    # 模型权重文件路径。留空表示未配置（后端不可用），需由启动文件或环境变量注入
    checkpoint_path: ""
    # 推理设备标识，形如 cuda:0 / cpu；本节点只做透传，由后端解释
    device: cuda:0
    # 后端包装模块名，模块内需提供 GraspNetBaselineInference 类
    backend_module: graspnet_baseline_inference
    # 单帧最多输出的抓取候选数。调大提高命中可行解的概率，但下游 IK 调用量随之增加
    max_grasps: 10
    # 送入网络的点云采样上限。调大更准，但显存占用与单帧耗时近似线性上升
    max_points: 20000
