# 抓取后安全撤退参数：由上层启动组合包加载到视觉抓取执行节点
# （rebotarm_visual_grasp_executor）。
# 撤退方向与抬升高度共同决定"拿起物体后往哪走"，默认策略是先把物体抬到台面以上，
# 再斜向后上方离开，避免水平撤退时把物体扫到台面或周边物体。
# 注意：本文件中的参数键都是对外接口，禁止改动；只允许增加注释。
rebotarm_visual_grasp_executor:
  ros__parameters:
    # 是否在抬起阶段后额外撤到远离目标的方向；置 false 则序列在抬起后直接结束
    safe_retreat_enabled: true
    # 撤退前的最低抬升高度（单位 m，0.12 = 12 cm）；与 lift_z_m 取较大者，
    # 保证先离开台面再水平移动。调小可能让撤退路径贴到桌面。
    safe_retreat_min_lift_z_m: 0.12
    # 撤退平移距离（单位 m，0.06 = 6 cm）；沿下面的方向轴直线退开
    safe_retreat_distance_m: 0.06
    # 撤退方向向量（基座系，内部会归一化，因此只关心方向不关心模长）。
    # 默认 [0.0, 1.0, 0.5] 表示沿 +Y 并向上 0.5 的斜向撤退；
    # 改成指向工作区外或向下的分量会让撤退路径经过台面或设备。
    safe_retreat_axis_xyz: [0.0, 1.0, 0.5]
    # 是否在序列末尾回安全位（整机回零）。默认 false：
    # 回零是大范围动作，必须由操作员显式开启，不能由抓取流程自动触发。
    safe_home_after_grasp: false
