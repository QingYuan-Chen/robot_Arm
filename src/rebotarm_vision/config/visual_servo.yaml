rebotarm_visual_grasp_executor:
  ros__parameters:
    plan_only_stage_pause_sec: 3.0
    refresh_plan_at_pregrasp_enabled: false
    refresh_plan_at_pregrasp_required: false
    refresh_plan_timeout_sec: 1.0
