# 抓取失败重试、抓取验证与抓取后放置策略：由上层启动组合包加载到视觉抓取执行节点
# （rebotarm_visual_grasp_executor）。
# 安全取向：默认全部关闭"自动继续动作"的开关（auto_retry_enabled=false、
# place_after_grasp_enabled=false），保持"一次命令一次动作"，需要时由操作员显式打开。
# 注意：本文件中的参数键都是对外接口，禁止改动；只允许增加注释。
rebotarm_visual_grasp_executor:
  ros__parameters:
    # 是否允许某个阶段失败后自动换下一个候选重试。默认 false：
    # 失败即停并回报原因，避免机械臂在无人确认的情况下连续尝试。
    auto_retry_enabled: false
    # 自动重试时最多使用的候选个数（含首次尝试）；只有"允许重试 + 该阶段可重试 + 还有剩余候选"三者同时成立才会重试。
    auto_retry_max_attempts: 3
    # 重试前是否先撤到接近点。默认 true，避免贴着目标原地换位形而刮碰物体。
    safe_retreat_before_retry: true
    # 是否在抬起阶段之后做抓取成功性验证（接触 + 闭合行程，可选视觉抬升证据）
    grasp_verification_enabled: true
    # 判定"确实夹住"所需的最小闭合行程（单位 m）；行程不足说明是空夹
    grasp_verification_min_closure_distance_m: 0.006
    # 是否要求必须检出夹爪接触；置 false 后仅凭闭合行程判成功，误判风险上升
    grasp_verification_require_contact: true
    # 是否引入视觉抬升证据（用最新抓取计划里目标高度的变化佐证物体被抬起）。
    # 默认 false：该项依赖视觉更新，未验证前不作为判据。
    visual_lift_check_enabled: false
    # 视觉抬升证据的最小高度变化（单位 m，0.03 = 3 cm）；低于该值判验证失败
    visual_lift_min_delta_m: 0.03
    # 是否在抓取成功后继续执行放置序列（move_to_place → 松爪 → 抬高撤离）。
    # 默认 false，防止未授权的大范围搬运动作。
    place_after_grasp_enabled: false
    # 放置点位置（基座系，单位 m）；默认落在操作者一侧、抬高的安全位置
    place_position_xyz: [-0.20, -0.20, 0.25]
    # 放置点姿态四元数 (x, y, z, w)，无量纲；默认绕 Z 轴 -90°，
    # 与本站抓取姿态一致，使松爪方向与目标摆放方向匹配
    place_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    # 放置点松爪的开口宽度（单位 m）；太小松不开、带动物体，太大可能碰倒目标
    place_open_position_m: 0.08
    # 放置点松爪的夹持力（归一化，不是牛顿）；松爪只需克服残余摩擦，故比抓取力小
    place_open_max_effort: 0.25
    # 松爪后向上撤离的高度（单位 m，0.06 = 6 cm），保证先垂直离开再平移
    place_retreat_z_m: 0.06
    # 真正执行前是否先用 execute=False 走一次规划预检：规划不通过就不下发轨迹。
    # 置 false 会跳过这道门，只剩执行服务自身的校验。
    trajectory_precheck_enabled: true
