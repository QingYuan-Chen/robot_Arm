rebotarm_grasp_candidate_ik_filter:
  ros__parameters:
    pose_policy: hybrid_geometry_with_base_axis_fallback
    fixed_grasp_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    base_approach_axis_xyz: [1.0, 0.0, 0.0]
    base_pregrasp_distance_m: 0.08
    orientation_yaw_offsets_rad: [0.0]
    candidate_grasp_z_offsets_m: [0.0]
    max_candidates_per_frame: 20
    lift_z_m: 0.08
    candidate_min_jaw_width_m: 0.006
    candidate_max_jaw_width_m: 0.082
    candidate_min_grasp_z_m: 0.0
    candidate_pregrasp_min_z_m: 0.120
    candidate_safe_lift_min_z_m: 0.120
    candidate_workspace_gate_enabled: false
    candidate_workspace_min_xyz: [0.18, -0.35, 0.0]
    candidate_workspace_max_xyz: [0.64, 0.35, 0.45]
    candidate_max_grasp_to_object_center_m: 0.15
    candidate_score_joint_distance_weight: 0.15
    candidate_score_joint6_weight: 0.35
    candidate_max_joint6_delta_rad: 1.5708
    candidate_joint6_symmetry_enabled: true
    candidate_joint6_symmetry_angle_rad: 3.141592653589793
    tcp_offset_xyz: [-0.04, 0.0, 0.0]
    target_base_offset_xyz: [0.0, 0.0, 0.0]
    pregrasp_base_z_offset_m: 0.05
    grasp_base_z_offset_m: 0.0

rebotarm_visual_grasp_executor:
  ros__parameters:
    pose_policy: base_axis
    fixed_grasp_orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
    base_approach_axis_xyz: [1.0, 0.0, 0.0]
    base_pregrasp_distance_m: 0.08
    min_grasp_z_m: 0.0
    lift_z_m: 0.08
    tcp_offset_xyz: [-0.04, 0.0, 0.0]
    target_base_offset_xyz: [0.0, 0.0, 0.0]
    pregrasp_base_z_offset_m: 0.05
    grasp_base_z_offset_m: 0.0

rebotarm_grasp_preview_sender:
  ros__parameters:
    pose_mode: pregrasp
    target_frame: base_link
    tcp_offset_xyz: [-0.04, 0.0, 0.0]
    target_base_offset_xyz: [0.0, 0.0, 0.0]
    base_z_offset_m: 0.05
    min_target_z_m: 0.0

rebotarm_visual_grasp_markers:
  ros__parameters:
    target_frame: base_link
    object_min_diameter_m: 0.06
    object_min_height_m: 0.12
    upright_object_marker: true
    tcp_offset_xyz: [0.0, 0.0, 0.0]
    gripper_open_axis_local_xyz: [0.0, 1.0, 0.0]
    show_tcp_markers: true
    show_approach_arrow: true
    show_gripper_open_axis: true

