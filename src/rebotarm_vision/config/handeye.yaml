# Source: /home/a/project/rebot_refer, commit
# 152f8f14ceec5cc8fc61664ff63915187a412800.
# ROS TF uses end_link -> camera_depth_frame. The active aligned RGB-D path
# deprojects with color intrinsics; do not apply factory color/depth extrinsics
# a second time.
handeye:
  parent_frame: end_link
  child_frame: camera_depth_frame
  translation:
    x: -0.085000000
    y: 0.010000000
    z: 0.045000000
  rotation:
    x: -0.523092811
    y: 0.578134825
    z: -0.405717914
    w: 0.476997914
