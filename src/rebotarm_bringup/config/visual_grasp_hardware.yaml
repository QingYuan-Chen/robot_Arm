schema_version: 1

workspace_assets:
  vision_python_executable: .venv-vision/bin/python
  graspnet_python_executable: .venv-graspnet/bin/python
  graspnet_model_root: .local-models/graspnet-baseline
  graspnet_checkpoint_path: .local-models/checkpoints/checkpoint-rs.tar

launch_arguments:
  use_hardware: true
  shutdown_safe_home: false
  execution_mode: plan_only
  vision_profile: ubuntu_native
  graspnet_source_mode: in_process
  graspnet_target_class_name: bottle
  start_visual_ready: false
  move_to_visual_ready_on_start: false
  start_motion_execution: true
  start_visual_grasp_executor: false
  start_sim_trajectory_controller: false
  use_local_rviz: true
  candidate_pose_policy: base_axis
  pose_policy: base_axis
  fixed_grasp_orientation_xyzw: [0.0, 0.0, -0.707106781, 0.707106781]
  tcp_offset_xyz: [-0.04, 0.0, 0.0]
  candidate_min_confidence: 0.4
  candidate_min_grasp_z_m: 0.05
  candidate_max_jaw_width_m: 0.080
  max_allowed_grasp_width_m: 0.080
  max_plan_age_sec: 1.5
  hardware_feedback_rate_hz: 50.0
  gripper_feedback_stale_timeout_sec: 0.15
  gripper_position_max_speed_rad_s: 1.5
  gripper_position_torque_cap_nm: 1.5
  grasp_hold_timeout_sec: 120.0
  execute_gripper: true
  gripper_grasp_enabled: true
  gripper_grasp_close_force: 1.0
  gripper_grasp_timeout_sec: 4.0
  auto_gripper_effort: false
  close_max_effort: 0.4
  lift_z_m: 0.04
  safe_retreat_enabled: true
  safe_home_after_grasp: true
  trajectory_precheck_enabled: true
  auto_retry_enabled: false
