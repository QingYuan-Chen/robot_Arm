# ament_python 包的可执行脚本安装位置约定（两节必须保持一致）。
# 构建时把 setup.py 中 console_scripts 声明的入口脚本生成到 lib/<包名>/ 下，
# 运行时 `ros2 run rebotarm_dashboard <可执行名>` 与启动文件里的 executable= 都按该路径解析；
# $base 由构建系统在安装阶段展开为安装前缀（install/<包名>），不能写成绝对路径。
[develop]
# 开发态（colcon build --symlink-install 等符号链接安装）时入口脚本的落地目录
script_dir=$base/lib/rebotarm_dashboard
[install]
# 正式安装时的入口脚本落地目录；改名会导致发布出来的可执行文件再也找不到
install_scripts=$base/lib/rebotarm_dashboard
