# ament_python 的安装脚本重定向配置。
#
# 作用：把 Python 包的 console_scripts 入口从默认的 bin/ 目录改到 ament 约定的
# lib/<包名>/ 目录下。该目录会被加入运行时环境，使 ros2 run 与启动文件里的
# executable 名称能够解析到对应脚本。
#
# [develop] 与 [install] 必须给出同样的路径，否则"工作空间源码运行"与"已安装
# 运行"两种方式下的可执行文件位置不一致，会出现只有其中一种能找到入口的问题。
# $base 由 ament/setuptools 在构建时替换为安装前缀，不要写成绝对路径。
[develop]
script_dir=$base/lib/rebotarm_voice_control
[install]
install_scripts=$base/lib/rebotarm_voice_control
