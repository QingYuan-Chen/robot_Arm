# 命名位姿表：把语音里的"去哪里"映射成固定目标位姿。
#
# 每个条目是一个位姿名（键名即命令参数 move_named_pose 的 name 取值），
# 值包含三部分：
#   frame_id    位姿所在坐标系。当前全部为 base_link（机械臂基座坐标系），
#               即位置/姿态都相对基座描述，与安全门校验的工作空间同参考系。
#   position    位置 [x, y, z]，单位米，顺序固定为 x/y/z。
#   orientation 姿态四元数 [x, y, z, w]，非欧拉角；必须接近单位四元数。
#
# 重要联动：一个位姿要真正可被语音使用，必须同时出现在本文件与
# safety_limits.yaml 的 allowed_named_poses 白名单中，并且 position 要落在
# safety_limits.yaml 的 workspace 盒内，否则会在安全门被拒。
# 当前三个位姿的坐标都已在 workspace（x 0.05~0.45、y ±0.25、z 0.05~0.45）内。

# 机械臂回位/待机位姿：靠近基座正前方低处，用于任务开始与结束时的安全姿态。
home:
  # 位置与姿态均相对基座坐标系 base_link 描述。
  frame_id: "base_link"
  # [x, y, z] 单位米：基座正前方 0.25 m、左右居中、高 0.25 m。
  position: [0.25, 0.0, 0.25]
  # 四元数 [x, y, z, w]：[0,0,0,1] 为单位四元数，表示保持工具默认朝向不变。
  orientation: [0.0, 0.0, 0.0, 1.0]

# 相机/观察位姿：抬到较高处并让末端朝向下方，便于俯视工作台拍照或巡检。
camera_pose:
  frame_id: "base_link"
  # 比 home 更前（0.30 m）更高（0.35 m），避开台面障碍并获得俯视视野。
  position: [0.30, 0.0, 0.35]
  # 四元数 y = z = 0.707（≈ √2/2，对应绕 y 轴约 90° 的旋转）：
  # 使末端法兰/工具轴线由水平转为接近竖直向下，形成俯视姿态；
  # 注意该四元数未做归一化（模长≈0.9998），下游使用前需归一化。
  orientation: [0.0, 0.707, 0.0, 0.707]

# 左侧放置位姿：用于把物体放到工作台左侧，姿态与 camera_pose 同为竖直向下。
place_left:
  frame_id: "base_link"
  # y = +0.18 m 表示位于基座左侧（+y 方向），略低（0.18 m）以便轻放。
  position: [0.20, 0.18, 0.18]
  # 与 camera_pose 相同的"竖直向下"姿态（同样未归一化），保证抓取/放置时
  # 工具朝向一致。
  orientation: [0.0, 0.707, 0.0, 0.707]
