# 语音/文本意图表：每个顶层键是一个意图名，由 IntentParser 按声明顺序做子串
# 匹配，命中第一个 pattern 即返回，因此顺序本身就是优先级，越具体的意图要越靠前。
#
# 字段含义：
#   patterns:     触发该意图的中文关键词（匹配前会去掉全部空白字符，故空格不影响命中）
#   command:      归一化命令名，交给路由层决定目标接口与安全校验分支
#   params:       随命令一起下发的参数（可选）
#   need_confirm: 是否需要操作员二次确认；涉及运动或状态改变的一般为 true
#   priority:     优先级，"highest" 用于停止/取消类命令
#
# 注意：本文件只描述"文本怎么映射成命令"，真正的安全上限在
# safety_limits.yaml 与代码中的安全门里再次校验，两者需保持一致。

# 使能机械臂：真实硬件默认失能，必须由显式指令重新使能，因此不再叠加确认步骤。
enable_arm:
  patterns:
    - "机械臂使能"
    - "启动机械臂"
  command: "enable_arm"
  need_confirm: false

# 失能机械臂：退出使能状态（不再输出主动控制力矩）。
disable_arm:
  patterns:
    - "机械臂失能"
    - "关闭机械臂"
  command: "disable_arm"
  need_confirm: false

# 回安全初始位姿：会大幅移动机械臂，必须二次确认后才下发。
safe_home:
  patterns:
    - "回到初始位置"
    - "回零"
    - "复位"
    - "回家"
  command: "safe_home"
  need_confirm: true

# 张开夹爪：position 为目标开度，单位米，0.09 即夹爪最大开口；
# max_effort 为力矩上限；只改变夹持状态，不移动机械臂，无需确认。
open_gripper:
  patterns:
    - "打开夹爪"
    - "张开夹爪"
    - "松开"
    - "放开"
  command: "set_gripper"
  params:
    position: 0.09
    max_effort: 0.5
  need_confirm: false

# 闭合夹爪：position 0.0 表示完全闭合；max_effort 为夹持力上限；
# 同样不改变机械臂位姿，无需确认。
close_gripper:
  patterns:
    - "关闭夹爪"
    - "夹紧"
    - "抓住"
    - "夹住"
  command: "set_gripper"
  params:
    position: 0.0
    max_effort: 0.5
  need_confirm: false

# 移动到拍照位：命名位姿必须同时出现在 safety_limits.yaml 的
# allowed_named_poses 与 named_poses.yaml 中，且位置在工作空间盒内。
move_camera_pose:
  patterns:
    - "移动到拍照位"
    - "去拍照位置"
    - "到观察位置"
  command: "move_named_pose"
  params:
    name: "camera_pose"
  need_confirm: true

# 移动到左侧放置位：同上，name 指向 named_poses.yaml 的 place_left。
move_place_left:
  patterns:
    - "移动到左侧放置位"
    - "去左边放置位"
    - "移动到放置位"
  command: "move_named_pose"
  params:
    name: "place_left"
  need_confirm: true

# 执行搬运演示：name 必须是 task_templates.yaml 中已定义的模板名，
# 模板内部由多步组成，安全门会校验模板是否存在。
run_pick_place_demo:
  patterns:
    - "执行搬运演示"
    - "开始搬运演示"
  command: "run_task_template"
  params:
    name: "pick_place_demo"
  need_confirm: true

# 停止/取消：优先级最高且不需要二次确认——安全动作不应被确认流程拖延。
stop_motion:
  patterns:
    - "停止"
    - "停下"
    - "别动"
    - "急停"
    - "取消"
  command: "stop_motion"
  need_confirm: false
  priority: "highest"
