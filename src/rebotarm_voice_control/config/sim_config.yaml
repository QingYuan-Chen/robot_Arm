# 仿真后端配置：选择仿真执行器，并声明仿真动作/坐标系的名称约定。
#
# 由 config_loader.load_sim_config 读取，主要消费方是仿真执行器
# （rebotarm_sim_executor）：命令行未传 --backend 时以本文件的 backend 为准。
# 注意：仿真执行器当前只读取 backend 键；moveit2 段落是 moveit2 后端的命名
# 约定表（动作名、规划坐标系、末端连杆），下游对接时以此为准，不要随意改名。

# 仿真执行后端：默认 "recorded"（只校验并记录，明确不派发任何目标，是安全的
# 离线默认值）；改为 "moveit2" 才会通过动作传输层把目标真正发到运行中的节点。
# 可选值：recorded / moveit2。
backend: "recorded"

# moveit2 仿真后端的命名约定（动作名均为全局绝对路径）。
moveit2:
  # 相对位移动作：与路由层 sim 模式的改写结果 /rebotarm/sim/move_relative 对应。
  move_relative_action: "/rebotarm/sim/move_relative"
  # 绝对命名位姿运动动作：对应 MoveToPose 类动作。
  move_named_pose_action: "/rebotarm/sim/move_to_pose"
  # 抓取动作：与 /place_object 共用同一类抓取执行动作消息。
  pick_object_action: "/rebotarm/sim/pick_object"
  # 放置动作：与 /pick_object 配对使用。
  place_object_action: "/rebotarm/sim/place_object"
  # 轨迹执行动作：沿用标准 MoveIt 的 /execute_trajectory（注意没有 sim 前缀，
  # 因为该接口由 MoveIt 侧的控制器管理器提供）。
  execute_trajectory_action: "/execute_trajectory"
  # 规划参考坐标系：位置/姿态目标都在该坐标系下解释，需与 URDF/SRDF 中的
  # 根坐标系一致。
  planning_frame: "base_link"
  # 末端执行器参考连杆名：规划与逆解以该连杆为工具端，需与机器人模型一致。
  end_effector_link: "grasp_tcp"
