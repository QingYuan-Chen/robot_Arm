# 大模型意图解析提供方配置：指定用哪个服务、哪个模型以及解码参数。
#
# 由 config_loader.load_llm_provider_config 读取；命令行显式传入的非空覆盖值
# 会覆盖本文件对应键（空串与 None 不覆盖，因此"未指定"不会意外把配置清空）。
# 密钥不写在本文件里：api_key_env 只是一个"环境变量名"，真实密钥由运行时
# 环境提供，缺失时会立即抛 LLMConfigurationError 而不是带空密钥发请求。

# 提供方名称：决定实例化哪个适配器。可选值 mock（本地规则、离线、不联网）、
# doubao（火山方舟/Ark 兼容接口）、openai（官方接口）。
provider: "doubao"

# 模型名/接入点标识：随提供方变化，须与提供方侧的可用模型一致，
# 否则请求会返回模型不存在的错误。
model: "doubao-seed-1.6"

# 服务基础地址（不含具体路径，SDK 自行拼接）。当前为火山方舟北京区兼容接口；
# 换区域或换网关时只需改这里与 model。
base_url: "https://ark.cn-beijing.volces.com/api/v3"

# 存放密钥的环境变量名（不存密钥本身）；运行时从该环境变量读取。
api_key_env: "ARK_API_KEY"

# 采样温度：0 表示贪心解码、输出可复现，意图解析必须稳定可复现，
# 因此默认取 0，不建议调大（调大后同一句话可能解析出不同工具调用）。
temperature: 0

# 期望的响应格式："json_object" 要求模型直接返回 JSON 对象，便于解析工具调用；
# 改成 "text" 等其它值会让下游 JSON 解析失败。
response_format: "json_object"
