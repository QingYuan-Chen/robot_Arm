# ament_python 包的入口脚本安装配置：声明包内可执行脚本（console_scripts）在
# 开发模式与安装模式下分别落到哪里，使 `ros2 run <包名> <可执行名>` 能找到它们。
# 两个目标目录都必须是 lib/<本包名>；若与 setup.py 中的包名不一致，安装后脚本
# 不可被发现，`ros2 run` 会报找不到可执行文件。
[develop]
# 开发（本地 editable/develop 安装）模式下入口脚本的放置目录；
# $base 由 setuptools 展开为本包在该模式下的安装基目录。
script_dir=$base/lib/rebotarm_simulation
[install]
# 正常安装模式下入口脚本的放置目录；
# $base 指安装前缀（例如 install/rebotarm_simulation），故脚本实际位于
# install/rebotarm_simulation/lib/rebotarm_simulation 下。
install_scripts=$base/lib/rebotarm_simulation
